<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Engineering for Software Development research flow</title>
  <desc id="desc">The thesis research is represented by a multi-agent programming prototype and a prompt development and evaluation harness that produce inspectable research artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1280" height="640" rx="28" fill="#f6f8fa"/>
  <text x="640" y="70" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#24292f">Research artifact map</text>
  <rect x="65" y="248" width="250" height="145" rx="18" fill="#0969da"/>
  <text x="190" y="305" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="white">Thesis research</text>
  <text x="190" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" fill="white">prompt engineering</text>
  <rect x="415" y="145" width="330" height="190" rx="18" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
  <text x="580" y="200" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0550ae">Multi-agent prototype</text>
  <text x="580" y="240" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#24292f">project manager, coder, tester</text>
  <text x="580" y="272" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#24292f">and debugger agents</text>
  <text x="580" y="310" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#57606a">multi_agentic_system_for_programming/</text>
  <rect x="415" y="390" width="330" height="145" rx="18" fill="#fff8c5" stroke="#bf8700" stroke-width="3"/>
  <text x="580" y="442" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#7d4e00">Evaluation harness</text>
  <text x="580" y="478" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#24292f">promptfoo configurations</text>
  <text x="580" y="508" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#57606a">prompt development and testing</text>
  <rect x="875" y="248" width="340" height="145" rx="18" fill="#1a7f37"/>
  <text x="1045" y="305" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="white">Inspectable artifacts</text>
  <text x="1045" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" fill="white">prototype code and results</text>
  <line x1="315" y1="320" x2="407" y2="240" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="315" y1="320" x2="407" y2="460" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="745" y1="240" x2="867" y2="300" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="745" y1="462" x2="867" y2="340" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
